<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <h1>Smart Attendance</h1>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="login-forms">
            <!-- Admin Login Form -->
            <div class="login-form admin-login">
                <h2>Admin Login</h2>
                <form method="POST" action="{{ url_for('admin_login') }}">
                    <div class="form-group">
                        <label for="admin_email">Email:</label>
                        <input type="email" id="admin_email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="admin_password">Password:</label>
                        <input type="password" id="admin_password" name="password" required>
                    </div>
                    <button type="submit">Login as Admin</button>
                </form>
            </div>

            <!-- Lecturer Login Form -->
            <div class="login-form lecturer-login">
                <h2>Lecturer Login</h2>
                <form method="POST" action="{{ url_for('lecturer_login') }}">
                    <div class="form-group">
                        <label for="lecturer_email">Email:</label>
                        <input type="email" id="lecturer_email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="lecturer_password">Password:</label>
                        <input type="password" id="lecturer_password" name="password" required>
                    </div>
                    <button type="submit">Login as Lecturer</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
