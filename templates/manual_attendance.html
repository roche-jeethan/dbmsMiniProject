<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Attendance - Smart Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <h1>Smart Attendance</h1>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('manual_attendance') }}" class="active">Manual Attendance</a>
            <a href="{{ url_for('reports') }}">Reports</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2>Manual Attendance Entry</h2>
        
        <div class="manual-attendance-section">
            <form id="manualAttendanceForm">
                <div class="form-group">
                    <label for="course">Select Course:</label>
                    <select id="course" name="course_id" required>
                        <option value="">Select a course</option>
                        {% for course in courses %}
                            <option value="{{ course.id }}">{{ course.name }} - Year {{ course.year }}, Section {{ course.section }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="student_id">Student ID:</label>
                    <input type="text" id="student_id" name="student_id" required placeholder="Enter student ID">
                </div>

                <div class="form-group">
                    <label for="reason">Reason:</label>
                    <textarea id="reason" name="reason" rows="3" placeholder="Enter reason for manual attendance"></textarea>
                </div>

                <button type="submit">Mark Attendance</button>
            </form>

            <div id="message" class="alert" style="display: none;"></div>
        </div>
    </div>

    <script>
        document.getElementById('manualAttendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const messageDiv = document.getElementById('message');

            fetch('/mark_attendance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams(formData)
            })
            .then(response => response.json())
            .then(data => {
                messageDiv.textContent = data.message;
                messageDiv.className = `alert alert-${data.status}`;
                messageDiv.style.display = 'block';
                
                if (data.status === 'success') {
                    document.getElementById('student_id').value = '';
                    document.getElementById('reason').value = '';
                }
                
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 3000);
            })
            .catch(error => {
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'alert alert-error';
                messageDiv.style.display = 'block';
            });
        });
    </script>
</body>
</html>
