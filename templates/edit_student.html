<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Smart Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <h1>Smart Attendance</h1>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2>Edit Student</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="edit-student-form">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" value="{{ student.name }}" required>
            </div>
            <div class="form-group">
                <label for="roll_number">Roll Number:</label>
                <input type="text" id="roll_number" name="roll_number" value="{{ student.roll_number }}" required>
            </div>
            <div class="form-group">
                <label for="year">Year:</label>
                <input type="number" id="year" name="year" value="{{ student.year }}" required min="1" max="4">
            </div>
            <div class="form-group">
                <label for="section">Section:</label>
                <input type="text" id="section" name="section" value="{{ student.section }}" required>
            </div>
            {% if is_admin %}
            <div class="form-group">
                <label for="course_id">Course:</label>
                <select id="course_id" name="course_id" required>
                    {% for course in courses %}
                        <option value="{{ course.id }}" {% if course.id == student.course_id %}selected{% endif %}>
                            {{ course.name }} (Year: {{ course.year }}, Section: {{ course.section }})
                        </option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}
            <div class="form-actions">
                <button type="submit">Update Student</button>
                <a href="{{ url_for('manage_students', course_id=student.course_id) }}" class="button cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
