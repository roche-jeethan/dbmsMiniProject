<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance - Smart Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .scanner-controls {
            display: flex;
            gap: 1rem;
            margin: 1rem 0;
            justify-content: center;
        }

        .scanner-controls button {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .pause-btn {
            background-color: #ffc107;
            color: #000;
        }

        .resume-btn {
            background-color: #28a745;
            color: white;
        }

        .stop-btn {
            background-color: #dc3545;
            color: white;
        }

        .scanner-status {
            text-align: center;
            padding: 2rem;
            background-color: #f8f9fa;
            border-radius: 4px;
            margin: 1rem 0;
            display: none;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>Smart Attendance</h1>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2>Take Attendance - {{ course.name }}</h2>
        <div class="attendance-section">
            <div class="qr-scanner">
                <h3>Scan QR Code</h3>
                <div id="qr-reader"></div>
                <div id="scanner-status" class="scanner-status">
                    Scanner paused. Click Resume to continue taking attendance.
                </div>
                <div class="scanner-controls">
                    <button id="pauseBtn" class="pause-btn">Pause</button>
                    <button id="resumeBtn" class="resume-btn" style="display: none;">Resume</button>
                    <button id="stopBtn" class="stop-btn">Stop Attendance</button>
                </div>
                <div id="message" class="alert" style="display: none;"></div>
            </div>
            
            <div class="manual-input">
                <h3>Or Enter Student ID</h3>
                <form id="attendanceForm">
                    <input type="hidden" id="courseId" value="{{ course.id }}">
                    <div class="form-group">
                        <input type="text" id="studentId" placeholder="Enter Student ID" required>
                    </div>
                    <button type="submit">Mark Attendance</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        let html5QrCode = null;
        let isScanning = false;

        function initializeScanner() {
            html5QrCode = new Html5Qrcode("qr-reader");
            startScanning();
        }

        function startScanning() {
            const config = {
                fps: 10,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };
            
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                onScanSuccess,
                onScanFailure
            ).then(() => {
                isScanning = true;
                document.getElementById('pauseBtn').style.display = 'inline-block';
                document.getElementById('resumeBtn').style.display = 'none';
                document.getElementById('scanner-status').style.display = 'none';
            }).catch((err) => {
                console.error("Error starting scanner:", err);
                showAlert('error', 'Failed to start scanner');
            });
        }

        function pauseScanning() {
            if (html5QrCode && isScanning) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    document.getElementById('pauseBtn').style.display = 'none';
                    document.getElementById('resumeBtn').style.display = 'inline-block';
                    document.getElementById('scanner-status').style.display = 'block';
                    document.getElementById('qr-reader').style.display = 'none';
                }).catch((err) => {
                    console.error("Error pausing scanner:", err);
                });
            }
        }

        function resumeScanning() {
            if (html5QrCode && !isScanning) {
                document.getElementById('qr-reader').style.display = 'block';
                document.getElementById('scanner-status').style.display = 'none';
                startScanning(); // This will reinitialize the scanner
            }
        }

        function stopScanning() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    isScanning = false;
                    window.location.href = "{{ url_for('dashboard') }}";
                }).catch((err) => {
                    console.error("Error stopping scanner:", err);
                });
            }
        }

        // Initialize scanner when page loads
        initializeScanner();

        // Event listeners for control buttons
        document.getElementById('pauseBtn').addEventListener('click', pauseScanning);
        document.getElementById('resumeBtn').addEventListener('click', resumeScanning);
        document.getElementById('stopBtn').addEventListener('click', () => {
            if (confirm('Are you sure you want to stop taking attendance?')) {
                stopScanning();
            }
        });

        function onScanSuccess(decodedText) {
            // Don't stop scanning after success, just mark attendance
            markAttendance(decodedText);
        }

        function onScanFailure(error) {
            // Handle scan failure silently to avoid console spam
            // console.warn(`QR scan error: ${error}`);
        }

        function markAttendance(studentId) {
            // Take photo from webcam
            const video = document.createElement('video');
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                    
                    // After video plays, take screenshot
                    video.onplay = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        
                        // Convert to base64
                        const imageData = canvas.toDataURL('image/jpeg');
                        
                        // Stop video stream
                        stream.getTracks().forEach(track => track.stop());
                        
                        // Send attendance with image
                        submitAttendance(studentId, imageData);
                    };
                });
        }

        function submitAttendance(studentId, imageData) {
            const courseId = document.getElementById('courseId').value;
            const messageDiv = document.getElementById('message');

            fetch('/mark_attendance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `student_id=${studentId}&course_id=${courseId}&image_data=${imageData}`
            })
            .then(response => response.json())
            .then(data => {
                messageDiv.textContent = data.message;
                messageDiv.className = `alert alert-${data.status}`;

                    audio.play();
                }
                
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 2000);
            })
            .catch(error => {
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'alert alert-error';
                messageDiv.style.display = 'block';
            });
        }

        // Manual form submission
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const studentId = document.getElementById('studentId').value;
            markAttendance(studentId);
            document.getElementById('studentId').value = '';
        });

        // Clean up when leaving the page
        window.addEventListener('beforeunload', function() {
            if (html5QrCode) {
                html5QrCode.stop().catch(err => console.error(err));
            }
        });

        // Add this helper function for alerts
        function showAlert(type, message) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = `alert alert-${type}`;
            messageDiv.style.display = 'block';
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
