<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Attendance - Smart Attendance</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <h1>Smart Attendance</h1>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2>Take Attendance - {{ course.name }}</h2>
        <div class="attendance-section">
            <div class="qr-scanner">
                <h3>Scan QR Code</h3>
                <div id="qr-reader"></div>
                <div id="message" class="alert" style="display: none;"></div>
            </div>
            
            <div class="manual-input">
                <h3>Or Enter Student ID</h3>
                <form id="attendanceForm">
                    <input type="hidden" id="courseId" value="{{ course.id }}">
                    <div class="form-group">
                        <input type="text" id="studentId" placeholder="Enter Student ID" required>
                    </div>
                    <button type="submit">Mark Attendance</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        const html5QrCode = new Html5Qrcode("qr-reader");
        const qrConfig = { fps: 10, qrbox: { width: 250, height: 250 } };
        
        // Start scanning immediately
        html5QrCode.start(
            { facingMode: "environment" },
            qrConfig,
            onScanSuccess,
            onScanFailure
        ).catch((err) => {
            console.error("Error starting scanner:", err);
        });

        function onScanSuccess(decodedText) {
            // Don't stop scanning after success, just mark attendance
            markAttendance(decodedText);
        }

        function onScanFailure(error) {
            // Handle scan failure silently to avoid console spam
            // console.warn(`QR scan error: ${error}`);
        }

        function markAttendance(studentId) {
            // Take photo from webcam
            const video = document.createElement('video');
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    video.play();
                    
                    // After video plays, take screenshot
                    video.onplay = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        canvas.getContext('2d').drawImage(video, 0, 0);
                        
                        // Convert to base64
                        const imageData = canvas.toDataURL('image/jpeg');
                        
                        // Stop video stream
                        stream.getTracks().forEach(track => track.stop());
                        
                        // Send attendance with image
                        submitAttendance(studentId, imageData);
                    };
                });
        }

        function submitAttendance(studentId, imageData) {
            const courseId = document.getElementById('courseId').value;
            const messageDiv = document.getElementById('message');

            fetch('/mark_attendance', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: `student_id=${studentId}&course_id=${courseId}&image_data=${imageData}`
            })
            .then(response => response.json())
            .then(data => {
                messageDiv.textContent = data.message;
                messageDiv.className = `alert alert-${data.status}`;

                    audio.play();
                }
                
                setTimeout(() => {
                    messageDiv.style.display = 'none';
                }, 2000);
            })
            .catch(error => {
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'alert alert-error';
                messageDiv.style.display = 'block';
            });
        }

        // Manual form submission
        document.getElementById('attendanceForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const studentId = document.getElementById('studentId').value;
            markAttendance(studentId);
            document.getElementById('studentId').value = '';
        });

        // Clean up when leaving the page
        window.addEventListener('beforeunload', function() {
            html5QrCode.stop().catch(err => console.error(err));
        });
    </script>
</body>
</html>
